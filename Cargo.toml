[workspace]
resolver = "2"
members = [
    "crates/ipn-core",
    "crates/ipn-ipc",
    "crates/ipn-daemon",
    "crates/ipn-cli",
    "crates/ipn-gui",
    "crates/ipn-mobile",
]

[workspace.package]
version = "0.7.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/steeb-k/nullgate"
rust-version = "1.85"

# Shared dependency versions. The iroh ecosystem crates MUST be bumped TOGETHER:
# they share `iroh-base`, and mixing minors fails to compile. After any bump run
# `cargo tree -d` and confirm a single `iroh-base` resolves. Versions mirror the
# proven set from seed-sync-gtk (iroh 1.0 line).
[workspace.dependencies]
# --- iroh P2P stack (pin together; all resolve to iroh-base 1.0) ---
# `unstable-custom-transports` exposes the PathSelector trait, which the engine
# implements to prefer the user's own relay servers (see ipn-core/src/relays.rs).
# It's semver-exempt, so re-verify it on every iroh bump.
iroh = { version = "1.0", features = ["unstable-custom-transports"] }
iroh-blobs = "0.103"
iroh-gossip = "0.101"
iroh-docs = "0.101"
iroh-tickets = "1.0"
iroh-mdns-address-lookup = "0.4"

# --- async runtime / utils ---
tokio = { version = "1", features = ["full"] }
futures-lite = "2"
async-channel = "2"
bytes = "1"
arc-swap = "1"

# --- gui (binding versions track installed GTK 4.22 / libadwaita 1.9) ---
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
glib = "0.22"
qrcode = { version = "0.14", default-features = false }

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"          # CBOR (serde)
data-encoding = "2"       # base32 for tickets / key strings

# --- crypto / hashing ---
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"              # constant-time comparison
rand = "0.8"

# --- platform / fs ---
directories = "5"
hostname = "0.4"
tun-rs = { version = "2", features = ["async_tokio"] }
# OS keystore for secrets at rest (Credential Manager / Keychain / Secret Service),
# with a file fallback handled in code.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Geolocation (originator only): read the DB-IP City MMDB + download it at runtime.
maxminddb = "0.24"
serde_json = "1"
rust_iso3166 = "0.1"
ureq = "2"

# --- ipc / service ---
interprocess = { version = "2", features = ["tokio"] }
widestring = "1"
windows-service = "0.8"

# --- diagnostics / cli ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# No-echo prompt: relay access tokens are asked for, never passed as arguments
# (argv is world-readable on this machine — `ps`, and the shell's history file).
rpassword = "7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Debug info only for OUR crates, not the ~600-crate dependency tree (iroh, GTK,
# …): full dep debuginfo made a from-scratch `target/debug` weigh ~32 GB, which
# filled the disk twice in one day and killed builds mid-compile. Backtraces
# through deps still resolve symbol names; stepping through our own code in a
# debugger is unaffected.
[profile.dev.package."*"]
debug = false

# `iroh` itself comes from our fork, NOT crates.io — the v1.0.0 tag plus one fix:
# `RemoteStateActor::pending_open_paths` (n0-computer/iroh#4390, unfixed upstream
# through 1.2.0) re-queued a failed path-open once *per connection* to a remote
# and retried every 333 ms, so with our several connections per peer the queue
# multiplied every tick — the multi-GB daemon blow-ups the memory watchdog kept
# restarting us for. The fork dedups + caps that queue. `iroh` reaches
# `iroh-base`/`iroh-relay`/`iroh-dns` by `path`, so all four are patched to the
# same rev or two `iroh-base`s resolve (`cargo tree -d` must stay clean).
# On an iroh bump: rebase the fork branch onto the new tag, or drop this table
# once #4390 is closed upstream.
[patch.crates-io]
iroh = { git = "https://github.com/steeb-k/iroh", rev = "8b7e3f67b9f9ba986b9e3afe52a3d0f3bdacca94" }
iroh-base = { git = "https://github.com/steeb-k/iroh", rev = "8b7e3f67b9f9ba986b9e3afe52a3d0f3bdacca94" }
iroh-relay = { git = "https://github.com/steeb-k/iroh", rev = "8b7e3f67b9f9ba986b9e3afe52a3d0f3bdacca94" }
iroh-dns = { git = "https://github.com/steeb-k/iroh", rev = "8b7e3f67b9f9ba986b9e3afe52a3d0f3bdacca94" }
