# Nullgate .deb and .rpm, built by nfpm from the tree scripts/package-linux.sh
# stages. Run it through scripts/package-linux-native.sh from the repo root:
# that script copies the staged tree to dist/native/tree (nfpm expands no
# variables in content paths, so the path is fixed), rewrites the unit for
# /usr/bin, and exports NULLGATE_VERSION for the version field.
#
# Differences from the tarball install, on purpose (docs/linux-packaging.md):
# binaries in /usr/bin rather than /usr/local/bin, the unit in
# /usr/lib/systemd/system, and no self-update timer — the package manager owns
# upgrades.
name: nullgate
arch: amd64
platform: linux
version: ${NULLGATE_VERSION}
version_schema: semver
release: "1"
section: net
priority: optional
maintainer: steeb-k <skaznak@protonmail.com>
vendor: steeb-k
homepage: https://github.com/steeb-k/nullgate
license: GPL-3.0-or-later
description: |-
  Private peer-to-peer network for your own devices
  Nullgate links your computers and phones into a private 10.99.0.0/24 network
  over iroh, so you can reach one machine directly with RDP, SSH or file sharing
  instead of routing everything through a home VPN. No accounts, no central
  server. Includes the daemon (a system service that owns the virtual
  interface), the desktop app with its tray agent, and nullgate-cli.

# The GUI needs glibc 2.39 (the ubuntu-24.04 build image); the daemon and CLI
# need 2.34. The daemon links libdbus directly (keyring's Secret Service).
overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libgcc-s1
      - libgtk-4-1 (>= 4.10)
      - libadwaita-1-0 (>= 1.4)
      - libdbus-1-3
  rpm:
    # Sonames rather than package names: Fedora calls these gtk4/libadwaita/
    # dbus-libs, openSUSE libgtk-4-1/libadwaita-1-0/libdbus-1-3.
    depends:
      - libc.so.6(GLIBC_2.39)(64bit)
      - libgcc_s.so.1()(64bit)
      - libgtk-4.so.1()(64bit)
      - libadwaita-1.so.0()(64bit)
      - libdbus-1.so.3()(64bit)

rpm:
  summary: Private peer-to-peer network for your own devices
  group: Applications/Internet
  compression: zstd

deb:
  # xz, not zstd: every dpkg reads it, and lintian rejects a data.tar.zst.
  compression: xz

contents:
  - src: dist/native/tree/bin/nullgate-daemon
    dst: /usr/bin/nullgate-daemon
    file_info: {mode: 0755}
  - src: dist/native/tree/bin/nullgate
    dst: /usr/bin/nullgate
    file_info: {mode: 0755}
  - src: dist/native/tree/bin/nullgate-cli
    dst: /usr/bin/nullgate-cli
    file_info: {mode: 0755}
  # Shipped for --status; it refuses to install, update or uninstall a
  # package-managed copy.
  - src: dist/native/tree/nullgatectl
    dst: /usr/bin/nullgatectl
    file_info: {mode: 0755}

  - src: dist/native/nullgate-daemon.service
    dst: /usr/lib/systemd/system/nullgate-daemon.service
    file_info: {mode: 0644}
  # The apps.kznjk.com repository, so a .deb or .rpm installed from a downloaded
  # file keeps updating (packaging/linux/repo/README.md). dpkg handles the
  # config files; the .rpm copies its definitions in postinstall, because dnf and
  # zypper read different directories and only one exists on a given system.
  - src: packaging/linux/repo/kznjk.sources
    dst: /etc/apt/sources.list.d/kznjk.sources
    type: config|noreplace
    packager: deb
    file_info: {mode: 0644}
  - src: packaging/linux/repo/kznjk-packages.asc
    dst: /etc/apt/keyrings/kznjk-packages.asc
    type: config|noreplace
    packager: deb
    file_info: {mode: 0644}
  - src: packaging/linux/repo/kznjk.repo
    dst: /usr/share/nullgate/repo/kznjk.repo
    packager: rpm
    file_info: {mode: 0644}
  - src: packaging/linux/repo/kznjk-zypper.repo
    dst: /usr/share/nullgate/repo/kznjk-zypper.repo
    packager: rpm
    file_info: {mode: 0644}

  - src: dist/native/tree/etc/xdg/autostart/io.github.steeb_k.Nullgate.desktop
    dst: /etc/xdg/autostart/io.github.steeb_k.Nullgate.desktop
    type: config|noreplace
    file_info: {mode: 0644}

  - src: dist/native/tree/share/applications/io.github.steeb_k.Nullgate.desktop
    dst: /usr/share/applications/io.github.steeb_k.Nullgate.desktop
    file_info: {mode: 0644}
  - src: dist/native/tree/share/metainfo/io.github.steeb_k.Nullgate.metainfo.xml
    dst: /usr/share/metainfo/io.github.steeb_k.Nullgate.metainfo.xml
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/16x16/apps/io.github.steeb_k.Nullgate.png
    dst: /usr/share/icons/hicolor/16x16/apps/io.github.steeb_k.Nullgate.png
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/32x32/apps/io.github.steeb_k.Nullgate.png
    dst: /usr/share/icons/hicolor/32x32/apps/io.github.steeb_k.Nullgate.png
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/64x64/apps/io.github.steeb_k.Nullgate.png
    dst: /usr/share/icons/hicolor/64x64/apps/io.github.steeb_k.Nullgate.png
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/128x128/apps/io.github.steeb_k.Nullgate.png
    dst: /usr/share/icons/hicolor/128x128/apps/io.github.steeb_k.Nullgate.png
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/256x256/apps/io.github.steeb_k.Nullgate.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.steeb_k.Nullgate.png
    file_info: {mode: 0644}
  - src: dist/native/tree/share/icons/hicolor/512x512/apps/io.github.steeb_k.Nullgate.png
    dst: /usr/share/icons/hicolor/512x512/apps/io.github.steeb_k.Nullgate.png
    file_info: {mode: 0644}

  # Each format's own place for the license.
  - src: packaging/linux/copyright
    dst: /usr/share/doc/nullgate/copyright
    packager: deb
    file_info: {mode: 0644}
  - src: dist/native/tree/LICENSE
    dst: /usr/share/licenses/nullgate/LICENSE
    packager: rpm
    file_info: {mode: 0644}

scripts:
  preinstall: packaging/linux/scripts/preinstall.sh
  postinstall: packaging/linux/scripts/postinstall.sh
  preremove: packaging/linux/scripts/preremove.sh
  postremove: packaging/linux/scripts/postremove.sh
